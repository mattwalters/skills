name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Pinned so a CLI release can't change the rules under a PR.
      # Bump deliberately.
      CLAUDE_CODE_VERSION: 2.1.283
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: bin/validate
